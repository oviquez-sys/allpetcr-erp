{% load static %}
<style>
#allpet-chat-dock {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  width: 400px;
  max-width: calc(100vw - 32px);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media print {
  #allpet-chat-dock { display: none !important; }
}

/* ---- Barra de entrada (siempre visible, estilo home de Claude) ---- */
.chat-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 26px;
  padding: 14px 10px 14px 20px;
  box-shadow: 0 10px 34px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.05);
  transition: box-shadow .2s, border-color .2s;
}
.chat-bar:focus-within {
  border-color: rgba(11,49,97,.25);
  box-shadow: 0 14px 40px rgba(0,0,0,.16), 0 0 0 4px rgba(11,49,97,.08);
}
.chat-bar .brand-dot {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #0B3161 0%, #1a4a7a 100%);
  display: flex; align-items: center; justify-content: center;
}
.chat-bar .brand-dot svg { width: 12px; height: 12px; fill: #CD963A; }
.chat-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  color: #1d1d1f;
  background: transparent;
  min-width: 0;
}
.chat-bar input::placeholder { color: #a1a1a6; }
.chat-bar .send-btn {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: #0B3161; color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: background .2s, transform .15s;
}
.chat-bar .send-btn:hover { background: #072244; }
.chat-bar .send-btn:disabled { opacity: .35; cursor: default; }

/* ---- Panel expandido (aparece arriba de la barra al conversar) ---- */
.chat-panel {
  display: none;
  flex-direction: column;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.16);
  margin-bottom: 12px;
  max-height: 60vh;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.06);
}
.chat-panel.active { display: flex; }
.chat-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid #f0f0f2;
}
.chat-panel-header .title {
  font-size: 13.5px; font-weight: 600; color: #1d1d1f;
  display: flex; align-items: center; gap: 8px;
}
.chat-panel-header .title .brand-dot {
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(135deg, #0B3161 0%, #1a4a7a 100%);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-panel-header .title .brand-dot svg { width: 11px; height: 11px; fill: #CD963A; }
.chat-panel-header button {
  background: none; border: none; cursor: pointer; color: #a1a1a6;
  font-size: 16px; padding: 4px; line-height: 1;
}
.chat-panel-header button:hover { color: #1d1d1f; }
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-message { display: flex; }
.chat-message.user { justify-content: flex-end; }
.chat-bubble {
  max-width: 82%;
  padding: 11px 15px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.5;
  word-wrap: break-word;
}
.chat-message.assistant .chat-bubble { background: #f5f5f7; color: #1d1d1f; border-bottom-left-radius: 4px; }
.chat-message.user .chat-bubble { background: #0B3161; color: #fff; border-bottom-right-radius: 4px; }
.chat-bubble h4 { font-size: 13.5px; font-weight: 700; margin: 10px 0 4px; color: #0B3161; }
.chat-bubble h4:first-child { margin-top: 0; }
.chat-bubble strong { font-weight: 700; }
.chat-bubble ul, .chat-bubble ol { margin: 4px 0 4px 18px; padding: 0; }
.chat-bubble li { margin-bottom: 2px; }
.chat-bubble p { margin: 0 0 6px; }
.chat-bubble p:last-child { margin-bottom: 0; }
.chat-loading { display: inline-flex; gap: 4px; padding: 2px 0; }
.chat-loading span {
  width: 6px; height: 6px; border-radius: 50%; background: #a1a1a6;
  animation: chat-bounce 1.3s infinite;
}
.chat-loading span:nth-child(2) { animation-delay: .15s; }
.chat-loading span:nth-child(3) { animation-delay: .3s; }
@keyframes chat-bounce {
  0%, 80%, 100% { opacity: .3; transform: scale(.8); }
  40% { opacity: 1; transform: scale(1); }
}
</style>

<div id="allpet-chat-dock">
  <div class="chat-panel" id="chat-panel">
    <div class="chat-panel-header">
      <div class="title">
        <span class="brand-dot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span>
        Ayuda AllPet
      </div>
      <button id="chat-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
  </div>

  <div class="chat-bar" id="chat-bar">
    <span class="brand-dot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span>
    <input type="text" id="chat-input" placeholder="Preguntá algo sobre AllPet...">
    <button class="send-btn" id="chat-send" disabled aria-label="Enviar">↑</button>
  </div>
</div>

<script>
(function () {
  const panel = document.getElementById('chat-panel');
  const bar = document.getElementById('chat-bar');
  const closeBtn = document.getElementById('chat-close');
  const messagesDiv = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const historial = []; // memoria de la conversación: [{role, content}, ...]

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
  });

  closeBtn.addEventListener('click', () => panel.classList.remove('active'));

  function openPanel() {
    panel.classList.add('active');
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    openPanel();
    input.value = '';
    sendBtn.disabled = true;

    const userMsg = document.createElement('div');
    userMsg.className = 'chat-message user';
    userMsg.innerHTML = `<div class="chat-bubble">${escapeHtml(message)}</div>`;
    messagesDiv.appendChild(userMsg);

    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'chat-message assistant';
    loadingMsg.innerHTML = '<div class="chat-bubble"><span class="chat-loading"><span></span><span></span><span></span></span></div>';
    messagesDiv.appendChild(loadingMsg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const response = await fetch('/api/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ message, history: historial })
      });

      loadingMsg.remove();

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Error desconocido');
      }

      const data = await response.json();
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'chat-message assistant';
      assistantMsg.innerHTML = `<div class="chat-bubble">${renderMarkdown(data.response)}</div>`;
      messagesDiv.appendChild(assistantMsg);

      // Memoria: se guarda el turno completo para las próximas preguntas.
      historial.push({ role: 'user', content: message });
      historial.push({ role: 'assistant', content: data.response });
    } catch (error) {
      loadingMsg.remove();
      const errorMsg = document.createElement('div');
      errorMsg.className = 'chat-message assistant';
      errorMsg.innerHTML = `<div class="chat-bubble">Error: ${escapeHtml(error.message)}</div>`;
      messagesDiv.appendChild(errorMsg);
    }

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Convierte un subconjunto simple de Markdown (##, **, listas, párrafos)
  // a HTML. No es un parser completo — alcanza para lo que responde Claude.
  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    let html = '';
    let inList = null; // 'ul' | 'ol' | null

    function closeList() {
      if (inList) { html += `</${inList}>`; inList = null; }
    }
    function inline(s) {
      return s
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code>$1</code>');
    }

    for (let raw of lines) {
      const line = raw.trim();
      if (!line) { closeList(); continue; }

      const h = line.match(/^#{1,6}\s+(.*)$/);
      if (h) { closeList(); html += `<h4>${inline(h[1])}</h4>`; continue; }

      const ol = line.match(/^\d+[.)]\s+(.*)$/);
      if (ol) {
        if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
        html += `<li>${inline(ol[1])}</li>`;
        continue;
      }

      const ul = line.match(/^[-*]\s+(.*)$/);
      if (ul) {
        if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
        html += `<li>${inline(ul[1])}</li>`;
        continue;
      }

      closeList();
      html += `<p>${inline(line)}</p>`;
    }
    closeList();
    return html;
  }

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
})();
</script>
