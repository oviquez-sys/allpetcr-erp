{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · ALLPETCR</title>
<style>
  :root{--bg:#f5f5f7;--ink:#1d1d1f;--ink2:#86868b;--brand:#0B3161}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.08);
    padding:56px 48px;max-width:480px;text-align:center}
  .emoji{font-size:64px;margin-bottom:16px}
  h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  p{font-size:16px;color:var(--ink2);line-height:1.5;margin-bottom:28px}
  a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;
    font-weight:600;font-size:16px;padding:14px 28px;border-radius:980px;transition:filter .2s}
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐾</div>
    <h1>No encontramos esa página</h1>
    <p>El enlace puede estar viejo o la dirección está mal escrita. No te preocupes, tus datos están a salvo.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
