<style>
body{background-color:#f5f5f7 !important}
.mn{--ink:#1d1d1f;--ink2:#6e6e73;--line:#ececf0;--brand:#0B3161;--verde:#1c6b30;--rojo:#b5231a;max-width:1120px;margin:0 auto;padding-bottom:90px;color:var(--ink)}
.mn a{text-decoration:none}
.mn{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mn-title{font-size:32px;font-weight:700;letter-spacing:-.025em;margin-bottom:2px}
.mn-sub{font-size:15px;color:var(--ink2);margin-bottom:20px;line-height:1.45}
/* Control segmentado: una franja gris con la opción elegida en blanco. */
.mn-nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:#e8e8ed;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg a,.seg button{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-size:14px;font-weight:500;color:#1d1d1f !important;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s}
.seg a:hover,.seg button:hover{background:rgba(255,255,255,.55)}
.seg .on{background:#fff !important;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.mn-links{margin-left:auto;display:flex;gap:18px}
/* En el celular las cuatro opciones caben en una sola franja, como en el iPhone. */
@media (max-width:600px){
  .mn-title{font-size:28px}
  .mn-nav{gap:10px}
  .mn .seg{display:flex;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .mn .seg::-webkit-scrollbar{display:none}
  .mn .seg a,.mn .seg button{flex:1 0 auto;text-align:center;padding:7px 9px;font-size:13px}
  .mn-links{margin-left:0;width:100%;justify-content:flex-end}
}
.mn-links a{font-size:14px;color:#0066cc !important}
.mn-links a:hover{text-decoration:underline !important}
.mn-revisar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#1d1d1f !important;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.mn-revisar .punto{width:8px;height:8px;border-radius:50%;background:#ff3b30;flex-shrink:0}
.mn-revisar .ir{margin-left:auto;color:#0066cc}
.card{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:16px}
.card h2{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--ink);background:none;padding:0;text-transform:none;letter-spacing:-.01em}
.ex{font-size:12.5px;color:var(--ink2);margin-bottom:12px;line-height:1.45}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:980px;padding:2px 9px;margin-right:4px}
.chip.oro{background:#fff4dc;color:#7a5a12}
.chip.ok{background:#eefaf1;color:var(--verde)}
.chip.no{background:#efeff1;color:#3a3a3c}
.chip.marca{background:#eef3fa;color:var(--brand);font-size:12.5px;padding:4px 11px;margin:0 6px 6px 0}
.btn{display:inline-block;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.azul{background:var(--brand);color:#fff !important}
.btn.gris{background:#fff;color:var(--ink) !important;border:1px solid #d9d9de}
.btn.wa{background:#25D366;color:#fff !important}
.aviso{background:#fff0ee;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#8a1f16;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.aviso b{color:#5c140f}
.aviso form{display:inline}
table.mt{width:100%;border-collapse:collapse;font-size:13px}
table.mt th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
table.mt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.mt td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pronto{color:var(--rojo);font-weight:700}
.bien{color:var(--verde)}
.gris{color:var(--ink2)}
.prod{color:var(--ink2);font-size:12.5px;margin-top:2px}
.canal{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px}
.canal.t{background:#eef3fa;color:var(--brand)}
.canal.w{background:#f3eefa;color:#5b2a91}
.vacio{padding:24px;text-align:center;color:var(--ink2);font-size:14px}
.tabla-scroll{overflow-x:auto}
</style>
