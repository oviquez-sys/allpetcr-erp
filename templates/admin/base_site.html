{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | ALLPETCR ERP{% endblock %}

{% block branding %}
<div id="site-name" style="display:flex;align-items:center;gap:12px;padding:6px 0">
  <a href="/" style="display:flex;align-items:center;gap:11px;text-decoration:none">
    <img src="{% static 'img/allpetcr-logo.png' %}" alt="AllPetcr.com" style="height:54px;display:block">
    <span style="font-weight:600;font-size:13px;color:#86868b;text-transform:uppercase;letter-spacing:.08em">Administración</span>
  </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrahead %}
<style>
/* --- Tema ALLPETCR sobre el admin de Django: barra blanca, acentos azules --- */
:root{
  --primary:#0B3161; --secondary:#0B3161; --accent:#0B3161;
  --link-fg:#0B3161; --link-hover-color:#072244; --link-selected-fg:#072244;
  --button-bg:#0B3161; --button-hover-bg:#072244;
  --default-button-bg:#0B3161; --default-button-hover-bg:#072244;
  --object-tools-bg:#072244; --object-tools-hover-bg:#003f80;
  --font-family-primary:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
#header{background:#fff;color:#1d1d1f;border-bottom:1px solid rgba(0,0,0,.08);box-shadow:0 1px 3px rgba(0,0,0,.04)}
#branding a:link,#branding a:visited,#site-name a{color:#1d1d1f !important}
#user-tools{color:#86868b}
#user-tools a:link,#user-tools a:visited{color:#0B3161;border-bottom:none}
#user-tools a:hover{color:#072244;border-bottom:none}
div.breadcrumbs{background:#f5f5f7;color:#86868b;border:none}
div.breadcrumbs a{color:#0B3161}
a:link,a:visited{color:#0B3161}
.module h2,.module caption,.inline-group h2{background:#0B3161}
.button,input[type=submit],input[type=button],.submit-row input,a.button{background:#0B3161;border-radius:8px}
.button:hover,input[type=submit]:hover{background:#072244}
.button.default,input[type=submit].default,.submit-row input.default{background:#072244}
.object-tools a{border-radius:980px}

.product-img-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.product-img-modal.open{display:flex}
.product-img-modal img{max-width:96vw;max-height:92vh;min-width:min(480px,90vw);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.product-img-modal-close{position:absolute;top:20px;right:30px;font-size:40px;color:#fff;cursor:pointer;background:none;border:none;padding:0;font-weight:300;line-height:1}
.product-img-modal-close:hover{opacity:.7}
.clickable-product-img{cursor:pointer;transition:opacity .2s}
.clickable-product-img:hover{opacity:.8}
</style>
{% endblock %}

{% block extrabody %}
<!-- Modal global para imágenes de productos -->
<div class="product-img-modal" id="productImgModal" onclick="if(event.target === this) this.classList.remove('open')">
  <button class="product-img-modal-close" onclick="document.getElementById('productImgModal').classList.remove('open')">×</button>
  <img id="productImgModalContent" alt="">
</div>
<script>
(function() {
  var modal = document.getElementById('productImgModal');
  var imgContent = document.getElementById('productImgModalContent');
  if(modal && imgContent){
    document.addEventListener('click', function(e) {
      if(e.target && e.target.classList && e.target.classList.contains('clickable-product-img')) {
        modal.classList.add('open');
        imgContent.src = e.target.src;
      }
    });
  }
  // La miga "Inicio" del admin lleva al panel principal del ERP, no al índice de Django.
  document.querySelectorAll('div.breadcrumbs a').forEach(function(a){
    var t = (a.textContent || '').trim().toLowerCase();
    if(t === 'inicio' || t === 'home'){ a.setAttribute('href', '/'); }
  });
})();
</script>
{% endblock extrabody %}
