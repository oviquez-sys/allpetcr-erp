{% load static %}<style>
body { background-color: #f5f5f7 !important; position: relative; }
body::before { content: ''; position: fixed; inset:0; background-image: url('{% static "patterns/allpetcr-logo.png" %}'); background-repeat: repeat; background-size: 120px 120px; opacity: 0.045; pointer-events: none; z-index: -1; }
.cc-wrap{max-width:1180px;margin:0 auto}
.cc-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.cc-sub{font-size:15px;color:#6e6e73;max-width:720px;line-height:1.5;margin-bottom:20px}
.cc-msg{padding:13px 18px;border-radius:14px;font-size:14.5px;margin-bottom:18px;background:rgba(11,49,97,.08);color:#0B3161}
.cc-msg.success{background:rgba(52,199,89,.12);color:#1c6b30}
.cc-msg.error{background:rgba(255,59,48,.1);color:#b5231a}
.cc-chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.cc-chip{display:flex;flex-direction:column;padding:12px 18px;border-radius:16px;background:#fff;border:1.5px solid #e8e8ed;min-width:150px;color:#1d1d1f;text-decoration:none}
.cc-chip b{font-size:22px;font-variant-numeric:tabular-nums}
.cc-chip span{font-size:13px;color:#6e6e73}
.cc-chip.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,49,97,.12)}
.cc-chip.cero b{color:#1c6b30}
.cc-nota{font-size:13.5px;color:#6e6e73;margin:0 0 18px}
.cc-nota a{color:var(--brand);font-weight:600;margin-left:6px}
.cc-card{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);border:.5px solid rgba(0,0,0,.04);overflow:hidden}
.cc-card table{width:100%;border-collapse:collapse;font-size:14.5px}
.cc-card th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#86868b;padding:12px 14px;border-bottom:1.5px solid #e8e8ed;font-weight:600}
.cc-card td{padding:12px 14px;border-bottom:1px solid #f0f0f2;vertical-align:top}
.cc-name{font-weight:600}
.cc-sku{color:#86868b;font-size:12px;margin-top:2px}
.cc-tag{display:inline-block;margin:6px 4px 0 0;padding:2px 9px;border-radius:980px;font-size:11.5px;font-weight:700;background:rgba(255,159,10,.16);color:#8a5700}
.cc-card select,.cc-card textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e0e0e6;border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.cc-card select{height:auto!important;min-height:38px;line-height:1.3;padding:8px 10px!important}
.cc-card textarea{min-height:64px;resize:vertical}
.cc-card .vacio{border-color:#f5b041;background:#fffaf0}
.cc-old{font-size:11.5px;color:#b5231a;margin-top:4px}
.cc-barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:18px 0}
.cc-btn{padding:12px 24px;border:none;border-radius:980px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.cc-btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.cc-excel{background:#fff;border-radius:20px;padding:18px 22px;margin-top:26px;border:1.5px dashed #d0d0d5}
.cc-excel h3{margin:0 0 6px;font-size:17px}
.cc-excel p{margin:0 0 12px;color:#6e6e73;font-size:14px;line-height:1.5}
.cc-pag{display:flex;gap:14px;align-items:center;font-size:14px}
.cc-pag a{color:var(--brand);font-weight:600}
.antes{color:#86868b;text-decoration:line-through}
.despues{color:#1c6b30;font-weight:600}
</style>
