# Producción en el VPS. En desarrollo local se usa SQLite (ver README).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: allpetcr
      POSTGRES_USER: allpetcr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: allpetcr
      POSTGRES_USER: allpetcr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?definir en .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
